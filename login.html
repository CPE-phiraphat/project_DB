<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | ระบบจัดการหอพัก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        /* แอนิเมชันสำหรับ Popup */
        .toast-enter { transform: translateY(-20px); opacity: 0; transition: all 0.3s ease-out; }
        .toast-enter-active { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen overflow-hidden">

    <!-- Popup แจ้งเตือน (ซ่อนไว้ก่อน) -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span id="toastMessage">ข้อความแจ้งเตือน</span>
    </div>

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-100 relative z-10">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">🏢 ศิรินทร์ พลัส</h1>
            <p class="text-gray-500 mt-2">ระบบจัดการอพาร์ทเมนท์ (Admin)</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">ชื่อผู้ใช้งาน</label>
                <input type="text" id="username" name="username" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                       placeholder="กรอกชื่อผู้ใช้งาน">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">รหัสผ่าน</label>
                <input type="password" id="password" name="password" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                       placeholder="กรอกรหัสผ่าน">
            </div>

            <button type="submit" id="loginBtn" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200 flex justify-center items-center gap-2">
                <span id="btnText">เข้าสู่ระบบ</span>
                <!-- สปินเนอร์ (ซ่อนไว้ก่อน) -->
                <svg id="btnSpinner" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>
    </div>

        <script>
        // ฟังก์ชันแสดง Popup แจ้งเตือน
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.innerText = message;
            
            // แสดง Popup
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            
            // ซ่อน Popup หลัง 3 วินาที
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
                toast.classList.remove('opacity-100');
            }, 3000);
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // 1. เปลี่ยนปุ่มเป็นสถานะกำลังโหลด
            btnText.innerText = 'กำลังตรวจสอบ...';
            btnSpinner.classList.remove('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            try {
                // URL ของ Webhook n8n (เช็คให้ตรงกับ Test หรือ Production)
                const N8N_WEBHOOK_URL = 'http://localhost:5678/webhook/login'; 

                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                // 2. อ่านค่าตอบกลับเป็น text ก่อน เพื่อป้องกันหน้าเว็บพัง (Error JSON)
                const text = await response.text();
                let data = {};
                try {
                    data = text ? JSON.parse(text) : {}; 
                } catch (err) {
                    console.error("การตอบกลับไม่ใช่ JSON:", text);
                }

                // 3. ตรวจสอบผลลัพธ์
                if (response.ok && data.success) {
                    // --- กรณีรหัสถูก ---
                    btnText.innerText = 'เข้าสู่ระบบสำเร็จ!';
                    btnSpinner.classList.add('hidden');
                    btn.classList.replace('bg-blue-600', 'bg-green-500');
                    
                    localStorage.setItem('admin_token', data.token); 
                    localStorage.setItem('admin_username', data.username);

                    setTimeout(() => {
                        window.location.href = 'dashboard.html'; 
                    }, 1500);

                } else {
                    // --- กรณีรหัสผิด ---
                    // ดึงข้อความ Error จาก n8n ถ้ามี ถ้าไม่มีให้ใช้ข้อความมาตรฐาน
                    const errorMessage = data.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
                    throw new Error(errorMessage);
                }

            } catch (error) {
                // 4. แสดง Popup แจ้งเตือน
                showToast(error.message);
                
                // คืนค่าปุ่มกลับมาให้กดใหม่ได้
                btnText.innerText = 'เข้าสู่ระบบ';
                btnSpinner.classList.add('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
